[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "odds-arb-br"
version = "0.1.0"
description = "Scanner async de arbitragem para odds do mercado brasileiro."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "odds-arb-br maintainers" },
]
dependencies = [
  "aiosqlite>=0.20.0",
  "curl-cffi>=0.7.0",
  "fastapi>=0.115.0",
  "h2>=4.1.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.4",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.1",
  "rapidfuzz>=3.9.6",
  "structlog>=24.4.0",
  "uvicorn>=0.30.0",
  "pydantic-settings>=2.4.0",
  "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.8",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/odds_arb"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
# "." coloca o pacote `app` (raiz do backend) no sys.path do pytest;
# `odds_arb` continua vindo do pacote instalado em src/.
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "slow: tests that use real network calls or longer-running integration paths",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = [
  "A",
  "ASYNC",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "N",
  "PERF",
  "PT",
  "RET",
  "RUF",
  "SIM",
  "UP",
  "W",
]
ignore = []

[tool.ruff.lint.flake8-bugbear]
# Depends/Security em defaults sao o padrao de injecao do FastAPI, nao defaults mutaveis.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
warn_unused_configs = true
show_error_codes = true
pretty = true
